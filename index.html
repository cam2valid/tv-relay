<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TV Relay</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         color: #ccc; font: 28px Arial, sans-serif; text-align: center; padding: 40px; }
</style>
</head>
<body>
<div id="msg">TV relay ready</div>
<div id="player"></div>
<script>
  // Relay page for the BeamNG TV Player mod.
  // Hosted on a real https site so YouTube accepts the embed.
  // URL params: v (video id), list (playlist id), start (seconds), mute (0/1), vol (0-100)
  var q = new URLSearchParams(location.search);
  var opts = {
    id: q.get('v') || '', list: q.get('list') || '',
    start: parseInt(q.get('start') || '0', 10) || 0,
    muted: q.get('mute') === '1',
    volume: q.has('vol') ? parseInt(q.get('vol'), 10) : 80
  };
  var player = null;

  function tell(obj) { try { parent.postMessage(Object.assign({ tvRelay: true }, obj), '*'); } catch (e) {} }
  function msg(t) { document.getElementById('msg').textContent = t; }

  function applyVolume(o) {
    if (!player || !player.setVolume) return;
    player.setVolume(o.volume == null ? 80 : o.volume);
    if (o.muted) player.mute(); else player.unMute();
  }

  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);

  window.onYouTubeIframeAPIReady = function () {
    if (!opts.id && !opts.list) { tell({ ready: true }); return; }
    var vars = { autoplay: 1, controls: 0, rel: 0, playsinline: 1,
                 start: opts.start, mute: opts.muted ? 1 : 0, origin: location.origin };
    if (opts.list) { vars.listType = 'playlist'; vars.list = opts.list; }
    player = new YT.Player('player', {
      width: '100%', height: '100%',
      videoId: opts.id || undefined,
      playerVars: vars,
      events: {
        onReady: function (e) { msg(''); applyVolume(opts); e.target.playVideo(); tell({ ready: true }); },
        onError: function (e) {
          var t = (e.data === 101 || e.data === 150) ? 'This video does not allow embedding'
                : 'YouTube error ' + e.data;
          msg(t); tell({ error: e.data, text: t });
        }
      }
    });
  };

  // Commands from the game's screen page
  window.addEventListener('message', function (ev) {
    var d = ev.data || {};
    if (!d.tvCmd || !player) return;
    if (d.tvCmd === 'pause'  && player.pauseVideo) player.pauseVideo();
    if (d.tvCmd === 'resume' && player.playVideo)  player.playVideo();
    if (d.tvCmd === 'stop'   && player.stopVideo)  player.stopVideo();
    if (d.tvCmd === 'volume') applyVolume(d);
  });
</script>
</body>
</html>
